[project]
name = "onpar"
version = "1.3.4"
description = "Prove which open model can replace your closed one — on your traffic, your hardware, your budget."
# The PyPI page was empty: no `readme` field meant a one-line summary and
# nothing else on the most-linked page this project has. A separate file rather
# than the README, for two reasons — the README carries thirteen relative image
# links that resolve only on GitHub, and it is 800 lines, which is a repo
# document rather than a shopfront.
readme = "PYPI.md"
requires-python = ">=3.11"
dependencies = []  # Phase 0 is stdlib-only on purpose: `uvx onpar fit` must just work.

[project.scripts]
onpar = "onpar.cli:main"
onpar-mcp = "onpar.mcp:serve"

[project.optional-dependencies]
# No `full` extra yet, deliberately, and the ordering matters: uv solves every
# extra before it will run anything, so naming a distribution that is not on
# PyPI makes THIS package unresolvable for people who never wanted it. A
# forward reference here breaks `uv run` for everyone.
#
# `release.yml` now builds and publishes both compiled distributions
# (`onpar-core` from onpar-py/, `onpar-gateway` from
# onpar-gateway/). Once a release has actually put them on PyPI — check,
# do not assume — add:
#
#     full = ["onpar-core==<version>", "onpar-gateway==<version>"]
#
# pinned exactly, because all three ship from one tag and `core.COMPATIBLE`
# refuses an extension whose version is not the package's own; a range would
# resolve to a combination the code rejects at import.
#
# Until then, build from the checkout: `maturin develop` in onpar-py/, and
# `cargo build --release -p onpar-gateway`.
# The extra goes back the day the wheel is published. See ADR-0009.
dev = ["pytest>=8", "ruff>=0.6", "pyyaml>=6"]  # pyyaml: tests/test_workflows.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onpar"]
artifacts = ["src/onpar/*.html", "src/onpar/*.json"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

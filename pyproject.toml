[project]
name = "clickllm"
version = "0.1.0"
description = "Prove which open model can replace your closed one — on your traffic, your hardware, your budget."
requires-python = ">=3.11"
dependencies = []  # Phase 0 is stdlib-only on purpose: `uvx clickllm fit` must just work.

[project.scripts]
clickllm = "clickllm.cli:main"
clickllm-mcp = "clickllm.mcp:serve"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clickllm"]
artifacts = ["src/clickllm/*.html", "src/clickllm/*.json"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

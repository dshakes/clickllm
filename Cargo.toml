[workspace]
members = ["clickllm-core", "clickllm-gateway", "clickllm-py"]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/dshakes/clickllm"
rust-version = "1.90"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = { version = "0.8", features = ["json"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes = "1"
futures-util = "0.3"
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
parking_lot = "0.12"
regex = "1"
chacha20poly1305 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# A sizing or licence bug here is silent and expensive; make the sharp edges compile errors.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
integer_division = "warn"
cast_possible_truncation = "warn"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# Deep review — point a reviewer at a FILE, not a diff.
#
# `sdlc-review`, `sdlc-audit` and `sdlc-audit-gemini` are all `pull_request`-only,
# so they can only ever see a change. Code that is already on `main` is
# unreachable by any of them, and the only way to get it read was to manufacture
# a diff — editing a docstring so a reviewer would look at the file underneath.
#
# That gap is why five modules totalling ~4,000 lines merged with no human or
# agent having read them end to end. The PR reviewer found a real defect in seven
# consecutive PRs on this repo, so the reviewing works; what was missing was any
# way to aim it.
#
# This is that way: dispatch it at a path and it reviews the file as it stands.
#
# You cannot test a change to this file on a branch. `claude-code-action`
# validates that the workflow matches the copy on the default branch and skips
# itself otherwise:
#
#   Skipping action due to workflow validation: the workflow file must exist and
#   have identical content to the version on the repository's default branch
#
# The step still reports success, the review never runs, and only the
# issue-exists check downstream fails — which reads exactly like the reviewer
# having found nothing. So a change here is merged first and exercised second,
# on one path before many. One dispatch was spent learning this.
name: "deep review (on demand)"

on:
  workflow_dispatch:
    inputs:
      path:
        description: "File to review, e.g. src/onpar/host.py"
        required: true
      focus:
        description: "Optional: what to weight (money, data loss, concurrency…)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write # the findings are filed as an issue, not a PR comment
  id-token: write

concurrency:
  group: deep-review-${{ github.event.inputs.path }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: the file must exist before a reviewer is paid to look for it
        env:
          TARGET: ${{ github.event.inputs.path }}
        run: |
          set -euo pipefail
          if [ ! -f "$TARGET" ]; then
            echo "::error::$TARGET does not exist. A review of nothing would still cost a run and still report clean."
            exit 1
          fi
          printf 'reviewing %s — %s lines\n' "$TARGET" "$(wc -l <"$TARGET")"

      - name: review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are **Deep Reviewer**. Review the FILE at
            `${{ github.event.inputs.path }}` as it currently stands — this is not
            a diff review, and nothing about this file is presumed already read.
            ${{ github.event.inputs.focus && format('Weight your attention toward: {0}.', github.event.inputs.focus) || '' }}

            This is a defect hunt, not a style pass. A reviewer found a real,
            confirmed defect in SEVEN consecutive PRs on this repo, every one
            invisible to a green test suite. The shape is consistent:

            - a returned error, gap or refusal DROPPED by its caller (`_gaps`
              destructured and discarded → an artifact claimed a fit it had not
              configured → OOM under a header saying it fit)
            - output CLAIMING something the code does not configure
            - arithmetic wrong in the direction that flatters — understated cost,
              overstated throughput, a denominator that quietly shrank
            - a failure path that only runs on the SECOND use, on a fork, or when
              one of two endpoints fails (`collections[0].failures[0]` → IndexError
              on exactly the path the error message existed for)
            - a float where an int was needed (`2.0**n` → OverflowError at n≥1024,
              on precisely the large inputs the function existed to handle)
            - a test that CANNOT fail: asserting a literal, comparing a value to
              itself, or a stub that behaves as assumed rather than as the real
              thing does

            Read the file's own tests too, and say plainly if any of them cannot
            fail. That finding is worth more than a style note.

            Report findings most-severe first. For each: line number, a
            one-sentence statement of the defect, and a CONCRETE failure scenario
            (inputs → wrong behaviour or lost data). Mark CONFIRMED (you traced
            it) versus PLAUSIBLE (looks wrong, unproven). Then state explicitly
            what you checked and found clean — that is as useful as the findings,
            because it says what has actually been read.

            The repo's invariants are in CLAUDE.md. Read it first.

            FILING — follow this exactly, it is the step that keeps failing.

            1. Write the full findings to `findings.md` with the Write tool.
            2. File them with precisely this command, and no other shape:

                gh issue create --title "deep review: ${{ github.event.inputs.path }}" --label agent:review --body-file findings.md

            Do NOT pass the body with `--body`, a heredoc, or `$(...)`. The
            sandbox permits `gh issue create` and the Write tool and nothing
            else, so a body assembled any other way is refused. Four reviews
            were performed in full and then lost that way — the files were read,
            the defects were found, and the findings never reached anyone.

            Do not file a placeholder first and plan to edit it. There is no
            `gh issue edit` here; a placeholder is permanent, and it makes an
            unreviewed file look reviewed.

            If you find nothing, say so in `findings.md` and file it anyway — an
            unreviewed file and a reviewed-clean file must never look the same
            from the outside, which is the whole reason this workflow exists.
          claude_args: |
            --model sonnet
            --max-turns 60
            --max-budget-usd 3.00
            --allowedTools "Read,Grep,Glob,Write,Bash(gh issue create:*),Bash(git log:*)"

      # The review step reports success whether or not it filed anything. Five
      # dispatches produced four issues — host.py and collect.py read their files
      # (the log shows "reviewing src/onpar/host.py — 1457 lines") and then
      # filed nothing, while cache.py was written twice. Both runs were green.
      #
      # A reviewer that produces no finding and no issue is indistinguishable
      # from one that found nothing, which is the single equivalence this
      # workflow exists to break. So the artifact is verified, not assumed.
      # Four dispatches died with 3-12 permission denials each, well inside
      # budget and turns, and the run summary said only "failure". Diagnosing it
      # meant pulling raw logs per run. The denial count is the single number
      # that separates "reviewed and could not file" from "ran out of money", so
      # it is printed rather than dug for.
      - name: what the sandbox refused, if anything
        if: always()
        run: |
          set -uo pipefail
          out=/home/runner/work/_temp/claude-execution-output.json
          [ -f "$out" ] || { echo "no execution output to read"; exit 0; }
          python3 - "$out" <<'PY'
          import json, sys
          try:
              blob = json.load(open(sys.argv[1]))
          except Exception as e:
              print(f"could not parse execution output: {e}"); raise SystemExit(0)
          rec = blob[-1] if isinstance(blob, list) else blob
          d = rec.get("permission_denials_count", 0)
          print(f"denials={d} turns={rec.get('num_turns')} cost=${rec.get('total_cost_usd', 0):.2f}")
          if d:
              print(f"::warning::the sandbox refused {d} tool call(s). If no issue was "
                    f"filed, the review was performed and the findings were lost — widen "
                    f"allowedTools rather than re-running into the same wall.")
          PY

      - name: an issue must exist for this path, or the review did not happen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.event.inputs.path }}
        run: |
          set -euo pipefail
          want="deep review: $TARGET"
          # --search rather than a client-side grep: the title must match, and a
          # near-miss (wrong path in the title) must read as absent, because that
          # is exactly how cache.py came to be reviewed twice.
          # Title AND substance. Of five dispatches, two filed an issue whose
          # body was `test-body-placeholder` (21 chars) and 4 chars — a title
          # check alone calls both of those a review. 400 chars is well under any
          # real finding and well over any placeholder.
          n="$(gh issue list --label agent:review --state all --limit 50 \
            --json title,body --jq \
            '[.[] | select(.title == "'"$want"'") | select((.body|length) > 400)] | length')"
          found="$n"
          if [ "$found" = "0" ]; then
            echo "::error::no substantive issue titled '$want'. Either none was filed, or one was filed with a placeholder body. The file was read and the finding was lost; treating that as a pass would make an unreviewed file look reviewed."
            exit 1
          fi
          echo "issue present for $TARGET"

name: release

# One-click release: resolve the version → refuse if it disagrees with the packaged
# one → build → tag → publish the GitHub Release → publish to PyPI over OIDC → open
# the Homebrew formula-bump PR. Runs on GitHub's runners, which have the ref-write
# access a local/sandboxed clone may not — so "cut a release" is a single tap from the
# Actions tab or GitHub Mobile (Run workflow), no terminal required.
#
# Two jobs on purpose. `build` holds every write to this repo; `publish-pypi` holds
# `id-token: write` and nothing else, so the OIDC credential that can publish under our
# name is scoped to the one job that needs it and is unreachable from the steps that run
# shell against the checkout.
#
# The formula bump lands as a PR — merge it to point
# `brew install` at the new tag. Mirrors scripts/release.sh; idempotent (safe to re-run).
#
# It lands as a PR because that is the reviewable shape, NOT because main is
# protected — it is not, and this comment used to say it was. Several other
# comments here describe what would hold *if* protection existed; they are
# intent, and `tools/release_preflight.py` reports the actual setting rather
# than leaving anyone to infer it from prose.

on:
  # Pushing a version tag releases. This was `workflow_dispatch` only, and the
  # gap is not cosmetic: everyone's mental model — including the author's, an
  # hour before writing this — is "tag it to release it". Pushing v0.1.0 did
  # nothing, said nothing, and left a tag on origin with no release behind it.
  #
  # A release workflow that silently no-ops on a version tag is the same defect
  # this repo spent a day removing from its own CI: a thing that looks like it
  # worked because nothing said otherwise.
  #
  # Both paths still work. The tag job below already skips creating a tag that
  # exists, so arriving by either route is safe.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0. Leave blank to use the version in pyproject.toml."
        required: false
        default: ""

permissions:
  contents: write          # create + push the tag, publish the Release
  pull-requests: write     # open the Homebrew formula-bump PR

# No workflow-level `concurrency:` here on purpose — see the note on `build`
# below. Each job that touches shared release state (the tag, PyPI, npm, the
# Homebrew PR) opts into the `release` group itself; `build-compiled` does not.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, not the workflow-level `concurrency:` this used to be. A
    # workflow-level group locks the *whole run* — including `build-compiled`,
    # whose macos-13 leg sat `queued` for four hours on 2026-08-13 waiting for
    # runner capacity that never came. `timeout-minutes` does not help there:
    # it only bounds time *after* a runner picks the job up, not time spent
    # queued, so the lock stayed held and every later release queued behind it
    # forever. Scoping the lock to the jobs that actually touch shared state
    # (this one, the publishers, homebrew) and leaving `build-compiled`
    # unlocked means a runner shortage on one matrix leg can no longer block
    # any other release from starting.
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.ver.outputs.version }}
      num: ${{ steps.ver.outputs.num }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0     # full history so the tag work sees existing tags

      - name: Resolve version
        id: ver
        env:
          IN: ${{ inputs.version }}
          # On a tag push the TAG is authoritative, not pyproject. Without this the
          # empty input falls through to pyproject, so tagging v0.2.0 against a
          # pyproject of 0.1.0 would release v0.1.0 — and the version gate below
          # would compare pyproject to itself and pass. A silently wrong release
          # is the failure this whole file is arranged to prevent.
          REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          v="${IN:-$REF_TAG}"
          if [ -z "$v" ]; then
            # pyproject is the source of truth for what gets built, so it is also the
            # default for what gets tagged. sed, not `cut -d'"'`, which mis-parses the
            # quote and yields an empty version → a release literally named "v".
            v="v$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -1)"
          fi
          case "$v" in v*) ;; *) v="v$v" ;; esac
          [ "$v" != "v" ] || { echo "::error::could not resolve a version (pass one, or fix pyproject.toml)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "num=${v#v}"  >> "$GITHUB_OUTPUT"
          echo "Releasing $v"

      # Runs before the tag, the build and the publish — the first thing that can fail.
      # `uv build` reads the version out of pyproject.toml and ignores the tag, so a
      # v0.2.0 release would upload 0.1.0 — and `skip-existing` below turns every release
      # after the first into a silent no-op that still prints "published". Refusing is the
      # only safe answer: rewriting pyproject here would ship an artifact whose version is
      # in no commit.
      - name: The tag and the packaged version must agree
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          packaged="$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -1)"
          tag="${VERSION#v}"
          [ -n "$packaged" ] || { echo "::error::could not read version from pyproject.toml"; exit 1; }
          if [ "$packaged" != "$tag" ]; then
            echo "::error::tag $VERSION would publish $packaged — pyproject.toml says $packaged, the tag says $tag. Bump pyproject.toml and re-run; publishing the wrong version silently is worse than not publishing."
            exit 1
          fi
          echo "tag $VERSION matches packaged $packaged"

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Build the sdist + wheel
        run: |
          set -euo pipefail
          # A dedicated outdir, not `dist/`: that directory is gitignored and is where a
          # locally-built `onpar_core` wheel lands, and a publish of `dist/*` would
          # happily push whatever else it found there.
          rm -rf dist-pypi
          uv build --out-dir dist-pypi
          ls -l dist-pypi/

      # The distribution, the console script and the import are all `onpar`. That
      # promise is made on every install surface, and a rename of any side breaks it
      # invisibly — the wheel still builds, still publishes, and installs a command
      # nobody documented.
      # Check the artifact itself, not the source.
      - name: The wheel must install the `onpar` command
        run: |
          set -euo pipefail
          unzip -p dist-pypi/*.whl '*/entry_points.txt' | tee /dev/stderr \
            | grep -qE '^onpar *= *onpar\.cli:main$' \
            || { echo "::error::the built wheel does not declare an \`onpar\` console script — \`pip install onpar\` would install the package but leave no \`onpar\` command"; exit 1; }

      - name: Create and push the tag (idempotent)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "tag $VERSION already on origin — skipping"
          else
            # Runners have no git identity; annotated tags need one (empty-ident fatal).
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "onpar $VERSION"
            git push origin "refs/tags/$VERSION"
          fi

      - name: Publish the GitHub Release (idempotent, marks Latest)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # --generate-notes, not a CHANGELOG extract: this repo has no CHANGELOG.md, and
          # the awk that assumed one made every release fail on step two.
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --latest --title "$VERSION — onpar" --generate-notes
          fi
          gh release upload "$VERSION" dist-pypi/*.whl dist-pypi/*.tar.gz --clobber

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-dist
          path: dist-pypi/


  # Split out so `id-token: write` — the credential that can publish to PyPI as us — is
  # held by a job that does nothing but download an artifact and upload it. `build` never
  # sees it. Job-level `permissions` replaces the workflow default rather than merging,
  # so this job also has no write access to the repo.
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/onpar
    permissions:
      id-token: write   # OIDC — trusted publishing, no API token/secret stored
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pypi-dist
          path: dist

      # v1.14.2, pinned to the commit its tag resolves to. The previous pin
      # (2026-05-21) bundled a twine too old to recognise `Metadata-Version:
      # 2.5`, which `uv build` now emits, so every wheel this repo builds today
      # is rejected before upload:
      #
      #     InvalidDistribution: Invalid distribution metadata:
      #     '2.5' is not a valid metadata version
      #
      # Nothing about the package changed — 0.1.9 shipped under older build
      # tooling. Any release cut now would fail the same way, which is worth
      # knowing: this was not a 1.0.0 problem, it was a dormant one that the
      # first release in a while surfaced.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Keeps a re-run idempotent; it must never fail on a version already up. The
          # cost is that it also cannot tell you it published nothing — which is why the
          # tag/version gate runs in `build`, and why the step below re-reads PyPI.
          skip-existing: true
          # PEP 740 Sigstore attestations. Recent action versions default this on, but
          # 1.30.0 published with attestations=NO and provenance=none, so the default
          # cannot be relied on — request it explicitly and verify it below.
          attestations: true

      # `skip-existing` means a green publish step is not evidence anything was published,
      # and a first release is exactly when the trusted-publisher config is least proven.
      # Ask PyPI what it actually holds for this version.
      - name: Verify PyPI recorded the release and its attestations
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.num }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          echo "checking onpar ${VERSION} on PyPI"
          FILES="import json,sys; print(' '.join(u['filename'] for u in json.load(sys.stdin)['urls']))"
          COUNT="import json,sys; print(len(json.load(sys.stdin).get('attestation_bundles') or []))"
          for attempt in 1 2 3 4 5; do
            sleep $((attempt * 10))   # PyPI indexes attestations a moment after upload
            RESP="$(curl -fsSL "https://pypi.org/pypi/onpar/${VERSION}/json")" || continue
            MISSING=""
            # Ask the integrity API, not the JSON API: PyPI does NOT populate an
            # "attestations" field on /pypi/<pkg>/<ver>/json, so checking it there reports
            # a false negative even when the bundle exists.
            for FN in $(printf '%s' "$RESP" | python3 -c "$FILES"); do
              N="$(curl -fsSL "https://pypi.org/integrity/onpar/${VERSION}/${FN}/provenance" 2>/dev/null | python3 -c "$COUNT" 2>/dev/null || echo 0)"
              [ "${N:-0}" -ge 1 ] || MISSING="$MISSING $FN"
            done
            if [ -z "$MISSING" ]; then
              echo "all artifacts present and attested"
              exit 0
            fi
            echo "attempt ${attempt}: still missing attestations on —${MISSING}"
          done
          echo "::error::PyPI does not report onpar ${VERSION} with PEP 740 attestations. Either the upload never landed (skip-existing hides that) or the publish failed to attest."
          exit 1

      - name: Say what was published
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            printf '## Published to PyPI\n\n'
            printf '`pip install onpar` resolves at %s, and installs the `onpar` command.\n\n' "$VERSION"
            printf 'Add `onpar` to `PUBLISHED_PACKAGE_NAMES` in `tests/test_docs_lab.py` '
            printf 'so the docs may use bare-name install commands again.\n'
          } >>"$GITHUB_STEP_SUMMARY"

# ── PyPI trusted publishing setup (one-time, on pypi.org) ──────────────────────
# PyPI → Your projects → Publishing → Add a new pending publisher. All four must
# match this file exactly or the OIDC claim is rejected:
#   PyPI Project Name : onpar
#   Owner             : dshakes
#   Repository        : onpar
#   Workflow name     : release.yml
#   Environment       : pypi
# No API token is ever stored — auth is OIDC, scoped to the publish-pypi job.

  # Its own job, not a tail on publish-pypi. That job never checks out the repo —
  # it only downloads the dist artifact — so `cd npm` there ran in an empty
  # workspace. It also holds `id-token: write` for Trusted Publishing, which npm
  # has no use for; a job that needs a checkout and not OIDC should not inherit
  # the inverse.
  #
  # `needs: publish-pypi` is load-bearing: the shim pins an exact PyPI version,
  # so publishing it first would ship a package pointing at something that does
  # not exist yet.

  # The two compiled distributions, without which half the README is unreachable.
  #
  # `onpar fit` is pure Python and must stay installable with nothing else —
  # that promise is why these are separate distributions rather than
  # dependencies. But `onpar observe` needs the gateway binary and
  # `onpar distill` needs the compiled extension, and neither was ever
  # published. A user who ran `pip install onpar` got the sizing half of
  # the product and, for the evidence half, an instruction to install a Rust
  # toolchain and run `cargo build`. CI has built the extension on every PR
  # since the seam job existed and thrown it away each time.
  #
  # manylinux via the action's container: a plain `maturin build` on ubuntu tags
  # the wheel `linux_x86_64`, which PyPI rejects outright.
  build-compiled:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64,  tag: manylinux }
          - { os: macos-latest,  target: aarch64, tag: macos-arm64 }
          - { os: macos-13,      target: x86_64,  tag: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    # Deliberately outside the `release` concurrency group (see `build` above).
    # `timeout-minutes` only bounds a job once a runner has started it — it does
    # nothing for a job stuck `queued` on a scarce runner image, which is what
    # actually happened: the macos-13 leg of the v1.1.0 run sat `queued` for
    # four hours on 2026-08-13 with no available runner. Back when this job
    # shared the workflow-level `release` lock, that queued job held it and
    # every later release queued behind it forever — three attempts at v1.1.1
    # scheduled zero jobs, and the run staying open also locks `gh run view
    # --log`, so the sibling failures could not even be read. Not sharing the
    # lock means a stuck macos-13 leg only delays *this* release's compiled
    # wheels, never blocks the next one.
    #
    # `timeout-minutes: 20` stays regardless — it is ~4x the observed build and
    # still catches a genuinely hung *execution* (e.g. a wedged maturin
    # process) once a runner has picked the job up.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the compiled extension (onpar-core)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m onpar-py/Cargo.toml
          manylinux: ${{ matrix.os == 'ubuntu-latest' && '2_28' || 'auto' }}

      - name: Build the gateway binary wheel (onpar-gateway)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m onpar-gateway/Cargo.toml
          manylinux: ${{ matrix.os == 'ubuntu-latest' && '2_28' || 'auto' }}

      # A wheel that installs but whose binary will not run is worse than no
      # wheel: it fails at the moment someone puts it in their request path.
      # Skipped when cross-built, where the artifact cannot run on this host.
      - name: The gateway wheel must produce a runnable binary
        if: matrix.os != 'macos-13'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/checkwheel
          /tmp/checkwheel/bin/pip install --quiet dist/onpar_gateway-*.whl
          /tmp/checkwheel/bin/onpar-gateway --help | head -1
          # And the CLI must FIND it — `find_gateway` looks beside the running
          # interpreter, which is the case a PATH-based lookup misses.
          /tmp/checkwheel/bin/pip install --quiet .
          /tmp/checkwheel/bin/python -c "
          from onpar.observe import find_gateway
          p = find_gateway()
          assert p is not None, 'the CLI cannot find the gateway it just installed'
          print('found', p)
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: compiled-${{ matrix.tag }}
          path: dist/*.whl

  # Separate job for the same reason `publish-pypi` is: `id-token: write` — the
  # credential that publishes under our name — is held by a job that downloads
  # an artifact and uploads it, and by nothing that runs shell against a
  # checkout.
  #
  # NOTE FOR THE FIRST RUN: `onpar-core` and `onpar-gateway` do not exist
  # on PyPI, so trusted publishing has nothing to trust yet. Create a *pending
  # publisher* for each on PyPI (owner `dshakes`, repo `onpar`, workflow
  # `release.yml`, environment `pypi`) before this can succeed. It fails loudly
  # until then rather than silently skipping, because a release that quietly
  # ships one of three distributions is what this whole job exists to end.
  publish-compiled:
    needs: [build, build-compiled]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release
      cancel-in-progress: false
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: compiled-*
          merge-multiple: true
          path: dist
      - name: What is about to be published
        run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
          # Same reasoning as the wheel job: a re-run of an already-published
          # version is a no-op, not a failure.
          skip-existing: true

  publish-npm:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # npm --provenance attests the tarball to this run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm is a SHIM over the PyPI distribution — `npx onpar-cli` execs
      # `uvx --from onpar==<version> onpar`. It publishes after PyPI on
      # purpose: the npm package names an exact PyPI version, so publishing it
      # first would ship a package pointing at something that does not exist yet.
      #
      # Gated on NPM_TOKEN, and NOT silent when absent — "released" and
      # "installable via npx" reading the same green tick is the defect.
      - name: Check for NPM_TOKEN
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "present=true" >>"$GITHUB_OUTPUT"
          else echo "present=false" >>"$GITHUB_OUTPUT"; fi

      - name: Publish the npm shim
        if: steps.npm.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `needs.build.outputs.version`, NOT `steps.ver` — `ver` runs in the
          # build job and step outputs do not cross jobs, so this was silently
          # the empty string. The agreement check below would then compare the
          # package version against "" and abort every real release.
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd npm
          # The same agreement gate PyPI gets. `tests/test_docs_lab.py` already
          # pins npm's version to pyproject's, so a mismatch here means the tag
          # disagrees with both — publish nothing rather than a shim that execs
          # a version of the tool nobody asked for.
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${VERSION#v}" ]; then
            # Single quotes and no backticks: inside double quotes those were
            # command substitution, so the failure path tried to RUN npx while
            # reporting that it should not be run.
            printf '::error::npm package is %s but the tag is %s. npx onpar-cli@%s would run the wrong Python.\n' \
              "$pkg" "${VERSION#v}" "${VERSION#v}"
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > ~/.npmrc

          # npm's equivalent of PyPI's `skip-existing`, which npm has no flag
          # for. This workflow's header says "idempotent (safe to re-run)" and
          # every other job is — `build` skips an existing tag, the Release is
          # idempotent, PyPI skips an existing version, and the formula step
          # exits early when it is already current. This one was not: a re-run
          # of an already-published version died with
          #
          #     npm error 403 - You cannot publish over the previously
          #     published versions: 1.0.0
          #
          # which turned a green release into a red one on a second run that had
          # nothing left to do. A documented property that nothing enforces is
          # the defect this repo keeps finding; here the document was the
          # workflow's own header.
          if npm view "onpar-cli@${VERSION#v}" version >/dev/null 2>&1; then
            printf '::notice::npm already has onpar-cli@%s — nothing to publish\n' "${VERSION#v}"
          else
            # --provenance ties the tarball to this workflow run, the same
            # property PEP 740 attestations give the wheel.
            npm publish --access public --provenance
          fi

          # Whether it was just published or already there, the registry must
          # actually serve it — the same reason PyPI's publish is followed by a
          # verification step. A skip that hid a never-published package would
          # be worse than the failure it replaced.
          # Retried, not asked once. npm serves through a CDN and a publish is
          # not visible to `npm view` the instant it returns, so this check has
          # failed on every release while the package was in fact published —
          # npm has served 1.1.1 through 1.1.4 with this step red each time.
          #
          # The check itself is right and worth keeping: it exists so a publish
          # that silently did nothing cannot report success, which is the defect
          # shape this repo keeps finding. But a verification that cries wolf on
          # every green release is worse than none, because it teaches everyone
          # to ignore the one time it means something. Six tries over ~60s is
          # far longer than propagation takes and still bounded.
          served=""
          for attempt in 1 2 3 4 5 6; do
            if npm view "onpar-cli@${VERSION#v}" version >/dev/null 2>&1; then
              served="yes"
              break
            fi
            printf 'npm has not served onpar-cli@%s yet (attempt %s) — waiting\n' "${VERSION#v}" "$attempt"
            sleep 10
          done
          if [ -z "$served" ]; then
            printf '::error::npm does not serve onpar-cli@%s 60s after publishing\n' "${VERSION#v}"
            exit 1
          fi

      - name: Say so when npm was NOT published
        if: steps.npm.outputs.present != 'true'
        run: |
          {
            printf '## npm shim NOT published\n\n'
            printf '`NPM_TOKEN` is not set, so `npx onpar-cli` still resolves nothing.\n'
            printf 'PyPI is unaffected: `pip install onpar` works.\n'
          } >>"$GITHUB_STEP_SUMMARY"

  # The Homebrew bump runs AFTER the package is actually published, in its own
  # job, and both of those are deliberate.
  #
  # It used to be the last step of `build`, and it was made fatal for a good
  # reason: it had failed silently for ten releases, pushing a `release/formula-*`
  # branch and opening no PR while the job stayed green, so `brew install` had
  # never once worked. Fatal was right. Fatal *inside `build`* was not — with
  # `publish-pypi` gated on `needs: build`, a formula bump that could not open a
  # PR stopped onpar 1.0.0 reaching PyPI at all, while the GitHub Release,
  # the README and every install pin already said 1.0.0. A broken `brew install`
  # became a broken `uvx --from onpar==1.0.0`, which is strictly worse.
  #
  # Ordering it after the publish is also just correct: a formula pointing at a
  # release whose artifacts are not on PyPI yet is premature.
  homebrew:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve version
        id: ver
        run: echo "version=${{ needs.build.outputs.version }}" >> "$GITHUB_OUTPUT"
      - name: Open the Homebrew formula-bump PR
        env:
          # SDLC_BOT_TOKEN (a PAT), falling back to github.token. A PR opened
          # with the default GITHUB_TOKEN is attributed to app/github-actions,
          # and every workflow run on that branch then lands in
          # `action_required` waiting for a human to approve it before it will
          # start. `main`'s ruleset requires `review` and `qa`, which never
          # run, so the PR reports "no checks reported" and can never merge —
          # while the job that opened it reports success. Both releases today
          # stalled there (6 runs on #208, 7 on #215), each needing manual
          # approval nobody was told to give. A PAT-opened PR is attributed to
          # a user and does not hit that gate, which keeps the approval
          # requirement where it belongs: genuinely external actors.
          GH_TOKEN: ${{ secrets.SDLC_BOT_TOKEN || github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Optional + generic: only repos that ship a Homebrew tap formula get this PR.
          formula="$(ls Formula/*.rb 2>/dev/null | head -1 || true)"
          [ -n "$formula" ] || { echo "no Homebrew formula in this repo — skipping formula PR"; exit 0; }
          url="https://github.com/$REPO/archive/refs/tags/$VERSION.tar.gz"
          sha="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
          [ -n "$sha" ] || { echo "could not compute tarball sha"; exit 1; }
          tmp="$(mktemp)"
          sed -E -e "s#archive/refs/tags/v[0-9.]+\.tar\.gz#archive/refs/tags/$VERSION.tar.gz#" \
                 -e "s/^([[:space:]]*sha256 )\"[a-f0-9]*\"/\1\"$sha\"/" "$formula" >"$tmp" && mv "$tmp" "$formula"
          if git diff --quiet -- "$formula"; then echo "formula already at $VERSION — no PR needed"; exit 0; fi
          branch="release/formula-$VERSION"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -aqm "chore(release): pin $VERSION + tarball sha in the Homebrew formula"
          git push -f origin "$branch"
          # `|| ... || true` used to swallow every outcome here. It swallowed ten
          # of them: v0.1.0 through v0.1.9 each pushed a `release/formula-*`
          # branch and opened NO pull request, while the release job stayed
          # green. The formula on main sat at v0.1.0 with a placeholder
          # `sha256 000…0`, so `brew install` had never once worked — under a
          # comment promising it "never lags a release".
          #
          # A push with no PR is the failure this step exists to prevent, so it
          # is now fatal. If a PR already exists for this branch, that is the
          # only tolerated non-creation, and it is checked for rather than
          # assumed.
          if ! gh pr create --base main --head "$branch" \
                --title "chore(release): Homebrew formula -> $VERSION" \
                --body "Automated formula bump for **$VERSION** (url + tarball \`sha256 $sha\`). Auto-merges once checks pass, so \`brew install\` never lags a release."; then
            existing="$(gh pr list --head "$branch" --state open --json number --jq 'length')"
            if [ "$existing" = "0" ]; then
              echo "::error::pushed $branch but could not open a PR, and none exists. The formula bump for $VERSION is stranded on a branch — brew will stay on the previous release. This was silent for ten releases; it is fatal now."
              exit 1
            fi
            gh pr edit "$branch" --body "Automated formula bump for $VERSION (sha256 $sha)."
          fi
          # Close the loop: land the bump automatically once required checks pass, so a
          # forgotten manual merge can't leave brew on a stale release. Tolerant — if the
          # repo hasn't enabled auto-merge, the CI drift guard on main still flags it.
          # NOTE: if branch protection requires the `ci` check, that check must be able
          # to run on this bot-authored PR — pushes made with the default GITHUB_TOKEN
          # don't trigger `on: pull_request`, so use a PAT (secrets.RELEASE_PAT) for the
          # push above if auto-merge stalls waiting on checks.
          gh pr merge --auto --squash "$branch" \
            || echo "::warning::could not enable auto-merge — enable 'Allow auto-merge' in repo settings (+ required checks), or merge the formula PR by hand"

      - name: Sync formula into the shared tap (dshakes/homebrew-tap)
        env:
          # The secret in this repo is HOMEBREW_TAP_TOKEN. This read was
          # HOMEBREW_TAP_PAT — a name that has never existed here — so TAP_PAT
          # was always empty and the step below took its skip path on every
          # release while reporting success.
          TAP_PAT: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Users install via `brew install dshakes/tap/onpar`, which reads the shared
          # tap repo — so each release must push the bumped formula there too. Cross-repo
          # write needs a PAT (the default GITHUB_TOKEN is scoped to this repo only).
          formula="$(ls Formula/*.rb 2>/dev/null | head -1 || true)"
          [ -n "$formula" ] || exit 0
          if [ -z "${TAP_PAT:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN not set — the tap was NOT updated, so \`brew install onpar\` still points at the previous release (or does not resolve at all). Add a fine-grained PAT with contents:write on dshakes/homebrew-tap. Failing rather than warning: this step reported success while skipping on every release up to v1.1.1, which is why the tap never had a formula."
            exit 1
          fi
          tmp="$(mktemp -d)"
          # No `2>/dev/null`: it discarded the one message that says WHY a clone
          # failed (bad token, missing scope, repo renamed), leaving a step that
          # could only be debugged by guessing.
          git clone --depth 1 "https://x-access-token:${TAP_PAT}@github.com/dshakes/homebrew-tap.git" "$tmp/tap" \
            || { echo "::error::could not clone dshakes/homebrew-tap — check HOMEBREW_TAP_TOKEN has contents:write on it"; exit 1; }
          mkdir -p "$tmp/tap/Formula"
          # Copy under THIS project's formula name. The tap is shared with other projects,
          # so a hardcoded name carried over from whichever repo this workflow was copied
          # from would overwrite a different tool's formula on every onpar release.
          cp "$formula" "$tmp/tap/Formula/$(basename "$formula")"
          cd "$tmp/tap"
          # `git add` first, and `git diff --cached` after it. `git diff` alone
          # reports only TRACKED changes, and onpar.rb was untracked in that
          # clone — the tap has never had it. So the check said "clean", the step
          # exited 0, and the formula was never committed: a sync that reported
          # success on every release while being structurally incapable of
          # bootstrapping a formula that did not already exist. `brew install
          # onpar` has never resolved because of this line.
          git add -A
          if git diff --cached --quiet; then echo "tap already current for $VERSION"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "onpar $VERSION"
          git push
          echo "synced onpar $VERSION into dshakes/homebrew-tap"

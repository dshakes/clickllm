<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,system-ui,sans-serif">
<title id='t'>Why the same model needs wildly different memory</title><desc id='d'>KV cache size per stream against context length, for MHA, GQA and MLA attention. A logarithmic axis, because MLA is roughly fifty times smaller than MHA and a linear axis would flatten the others to nothing.</desc>
<style>
:root{--s0:#0e9bbd;--s1:#8b5cf6;--s2:#c2820b;--s3:#e0405f;--bg:#0d1320;--panel:#111a2b;--ink:#eef4ff;--ink2:#9fb0cc;--muted:#63758f;--grid:#1c2534;}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}}
:root[data-theme=light]{--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}
.t{fill:var(--ink);font-size:15px;font-weight:650}.sub{fill:var(--ink2);font-size:11.5px}.lb{fill:var(--ink2);font-size:11px}.ax{fill:var(--muted);font-size:10.5px}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;fill:var(--ink2)}.g{stroke:var(--grid);stroke-width:1}.note{fill:var(--muted);font-size:10.5px;font-style:italic}
</style>
<rect width="860" height="470" fill="var(--bg)"/>
<text x="28" y="30" class="t">Why the same model needs wildly different memory</text>
<text x="28" y="50" class="sub">KV bytes per stream · 32B-class model · log scale, because the spread is two orders of magnitude</text>
<line x1="92" y1="312.0" x2="612" y2="312.0" class="g"/>
<text x="82" y="315.5" class="ax" text-anchor="end">1 MB</text>
<line x1="92" y1="277.1" x2="612" y2="277.1" class="g"/>
<text x="82" y="280.6" class="ax" text-anchor="end">10 MB</text>
<line x1="92" y1="242.2" x2="612" y2="242.2" class="g"/>
<text x="82" y="245.7" class="ax" text-anchor="end">100 MB</text>
<line x1="92" y1="207.3" x2="612" y2="207.3" class="g"/>
<text x="82" y="210.8" class="ax" text-anchor="end">1 GB</text>
<line x1="92" y1="172.3" x2="612" y2="172.3" class="g"/>
<text x="82" y="175.8" class="ax" text-anchor="end">10 GB</text>
<line x1="92" y1="137.4" x2="612" y2="137.4" class="g"/>
<text x="82" y="140.9" class="ax" text-anchor="end">100 GB</text>
<line x1="92" y1="102.5" x2="612" y2="102.5" class="g"/>
<text x="82" y="106.0" class="ax" text-anchor="end">1000 GB</text>
<text x="92.0" y="330.0" class="ax" text-anchor="middle">4k</text>
<text x="265.3" y="330.0" class="ax" text-anchor="middle">16k</text>
<text x="438.7" y="330.0" class="ax" text-anchor="middle">64k</text>
<text x="612.0" y="330.0" class="ax" text-anchor="middle">256k</text>
<text x="352" y="350" class="ax" text-anchor="middle">context length</text>
<polyline points="92.0,297.4 265.3,276.4 438.7,255.3 612.0,234.3" fill="none" stroke="var(--s0)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

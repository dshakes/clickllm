<circle cx="265.3" cy="276.4" r="4.5" fill="var(--s0)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="438.7" cy="255.3" r="4.5" fill="var(--s0)" stroke="var(--bg)" stroke-width="2"/>
<circle cx="612.0" cy="234.3" r="4.5" fill="var(--s0)" stroke="var(--bg)" stroke-width="2"/>
<text x="626" y="238.3" class="lb" fill="var(--s0)">MHA</text>
<polyline points="92.0,328.9 265.3,307.9 438.7,286.9 612.0,265.9" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

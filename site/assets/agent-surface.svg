<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,system-ui,sans-serif">
<title id='t'>The agent surface, and its wall</title><desc id='d'>Nine read-only tools, receipts and eval sets as resources confined to one root, and three pre-built workflows. No verb moves production traffic.</desc>
<style>
:root{--s0:#0e9bbd;--s1:#8b5cf6;--s2:#c2820b;--s3:#e0405f;--bg:#0d1320;--panel:#111a2b;--ink:#eef4ff;--ink2:#9fb0cc;--muted:#63758f;--grid:#1c2534;}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}}
:root[data-theme=light]{--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}
.t{fill:var(--ink);font-size:15px;font-weight:650}.sub{fill:var(--ink2);font-size:11.5px}.lb{fill:var(--ink2);font-size:11px}.ax{fill:var(--muted);font-size:10.5px}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;fill:var(--ink2)}.g{stroke:var(--grid);stroke-width:1}.note{fill:var(--muted);font-size:10.5px;font-style:italic}@keyframes clkpulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes clkflow{to{stroke-dashoffset:-28}}@keyframes clkpop{0%{opacity:0}3%{opacity:1}92%{opacity:1}100%{opacity:0}}.pulse{animation:clkpulse 2.4s ease-in-out infinite}.flow{animation:clkflow 1.1s linear infinite}.pop{animation:clkpop 6s linear infinite both}@keyframes clkstream{from{transform:translateX(0)}to{transform:translateX(46px)}}@keyframes clklight{0%,12%{opacity:.10}26%,68%{opacity:1}84%,100%{opacity:.10}}.stream{transform-box:fill-box;animation:clkstream 1.15s linear infinite}.light{animation:clklight 3.45s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.pulse,.flow,.pop,.stream,.light{animation:none;opacity:1;transform:none}}
</style>
<rect width="860" height="400" fill="var(--bg)"/>
<text x="28" y="30" class="t">The agent surface, and its wall</text>
<rect x="40" y="92" width="248" height="168" rx="8" fill="var(--panel)"/>
<text x="56" y="118" class="t" style="font-size:13px">tools</text>
<text x="56" y="146" class="sub">fit · where · explain</text>
<text x="56" y="170" class="sub">advise · catalog</text>
<text x="56" y="194" class="sub">prove · receipt</text>
<text x="56" y="218" class="sub">guard · build</text>
<rect x="308" y="92" width="248" height="168" rx="8" fill="var(--panel)"/>
<text x="324" y="118" class="t" style="font-size:13px">resources</text>
<text x="324" y="146" class="sub">clickllm:///receipt.json</text>
<text x="324" y="170" class="sub">clickllm:///evalset.json</text>
<text x="324" y="218" class="sub">confined to CLICKLLM_EVAL_ROOT</text>
<rect x="576" y="92" width="248" height="168" rx="8" fill="var(--panel)"/>
<text x="592" y="118" class="t" style="font-size:13px">prompts</text>
<text x="592" y="146" class="sub">size-a-model</text>
<text x="592" y="170" class="sub">prove-a-migration</text>
<text x="592" y="194" class="sub">check-a-receipt-still-holds</text>
<rect x="40" y="288" width="780" height="54" rx="8" fill="none" stroke="#e0405f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="60" y="312" class="t" style="font-size:13px;fill:#e0405f">cutover, deploy, route, promote</text>
<text x="60" y="331" class="sub">Not absent by policy — absent by construction. There is no such tool to call.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 448" width="860" height="448" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,system-ui,sans-serif">
<title id='t'>Continuous batching: stop waiting for the slowest request</title><desc id='d'>Two timelines. Static batching runs four requests in lockstep and idles until the longest finishes. Continuous batching admits a new request into the slot the moment one frees, leaving almost no idle time.</desc>
<style>
:root{--s0:#0e9bbd;--s1:#8b5cf6;--s2:#c2820b;--s3:#e0405f;--bg:#0d1320;--panel:#111a2b;--ink:#eef4ff;--ink2:#9fb0cc;--muted:#63758f;--grid:#1c2534;}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}}
:root[data-theme=light]{--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}
.t{fill:var(--ink);font-size:15px;font-weight:650}.sub{fill:var(--ink2);font-size:11.5px}.lb{fill:var(--ink2);font-size:11px}.ax{fill:var(--muted);font-size:10.5px}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;fill:var(--ink2)}.g{stroke:var(--grid);stroke-width:1}.note{fill:var(--muted);font-size:10.5px;font-style:italic}@keyframes clkpulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes clkflow{to{stroke-dashoffset:-28}}@keyframes clkpop{0%{opacity:0}3%{opacity:1}92%{opacity:1}100%{opacity:0}}.pulse{animation:clkpulse 2.4s ease-in-out infinite}.flow{animation:clkflow 1.1s linear infinite}.pop{animation:clkpop 6s linear infinite both}@keyframes clkstream{from{transform:translateX(0)}to{transform:translateX(46px)}}@keyframes clklight{0%,12%{opacity:.10}26%,68%{opacity:1}84%,100%{opacity:.10}}.stream{transform-box:fill-box;animation:clkstream 1.15s linear infinite}.light{animation:clklight 3.45s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.pulse,.flow,.pop,.stream,.light{animation:none;opacity:1;transform:none}}
</style>
<rect width="860" height="448" fill="var(--bg)"/>
<text x="28" y="30" class="t">Continuous batching: stop waiting for the slowest request</text>
<text x="28" y="50" class="sub">Four slots, same requests, same hardware — the difference is entirely scheduling</text>
<text x="28" y="88" class="lb">static batching</text>
<text x="114" y="116" class="ax" text-anchor="end">slot 1</text>
<rect x="266" y="100" width="276" height="24" rx="4" fill="var(--grid)" opacity="0.55"/>
<rect class="pop" style="animation-delay:0.00s" x="129" y="100" width="135" height="24" rx="4" fill="var(--s0)"/>
<text x="114" y="146" class="ax" text-anchor="end">slot 2</text>
<rect x="450" y="130" width="92" height="24" rx="4" fill="var(--grid)" opacity="0.55"/>
<rect class="pop" style="animation-delay:0.00s" x="129" y="130" width="319" height="24" rx="4" fill="var(--s1)"/>
<text x="114" y="176" class="ax" text-anchor="end">slot 3</text>
<rect x="312" y="160" width="230" height="24" rx="4" fill="var(--grid)" opacity="0.55"/>
<rect class="pop" style="animation-delay:0.00s" x="129" y="160" width="181" height="24" rx="4" fill="var(--s2)"/>
<text x="114" y="206" class="ax" text-anchor="end">slot 4</text>
<rect x="542" y="190" width="0" height="24" rx="4" fill="var(--grid)" opacity="0.55"/>
<rect class="pop" style="animation-delay:0.00s" x="129" y="190" width="411" height="24" rx="4" fill="var(--s3)"/>
<text x="554" y="145" class="lb" style="fill:var(--s3)">idle until the slowest finishes</text>
<text x="28" y="252" class="lb">continuous batching</text>
<text x="114" y="280" class="ax" text-anchor="end">slot 1</text>
<rect x="450" y="264" width="92" height="24" rx="4" fill="var(--grid)" opacity="0.55"/>
<rect class="pop" style="animation-delay:0.00s" x="129" y="264" width="135" height="24" rx="4" fill="var(--s0)"/>
<rect class="pop" style="animation-delay:1.35s" x="267" y="264" width="181" height="24" rx="4" fill="var(--s1)"/>
<text x="114" y="310" class="ax" text-anchor="end">slot 2</text>
<rect x="450" y="294" width="92" height="24" rx="4" fill="var(--grid)" opacity="0.55"/>
<rect class="pop" style="animation-delay:0.00s" x="129" y="294" width="319" height="24" rx="4" fill="var(--s1)"/>
<text x="114" y="340" class="ax" text-anchor="end">slot 3</text>
<rect x="450" y="324" width="92" height="24" rx="4" fill="var(--grid)" opacity="0.55"/>
<rect class="pop" style="animation-delay:0.00s" x="129" y="324" width="181" height="24" rx="4" fill="var(--s2)"/>
<rect class="pop" style="animation-delay:1.80s" x="313" y="324" width="135" height="24" rx="4" fill="var(--s3)"/>
<text x="114" y="370" class="ax" text-anchor="end">slot 4</text>
<rect class="pop" style="animation-delay:0.00s" x="129" y="354" width="411" height="24" rx="4" fill="var(--s3)"/>
<text x="28" y="390" class="note">Same tokens, same GPU. Static batching leaves the shaded time unused;</text>
<text x="28" y="406" class="note">continuous batching sells it — the single biggest throughput win in modern</text>
<text x="28" y="422" class="note">serving, and on by default in vLLM and SGLang.</text>
</svg>
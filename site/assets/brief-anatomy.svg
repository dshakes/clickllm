<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,system-ui,sans-serif">
<title id='t'>What a stakeholder receives</title><desc id='d'>`clickllm brief` renders the receipt as one self-contained page: no network, no script, opens offline in six months. The order is the argument.</desc>
<style>
:root{--s0:#0e9bbd;--s1:#8b5cf6;--s2:#c2820b;--s3:#e0405f;--bg:#0d1320;--panel:#111a2b;--ink:#eef4ff;--ink2:#9fb0cc;--muted:#63758f;--grid:#1c2534;}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}}
:root[data-theme=light]{--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}
.t{fill:var(--ink);font-size:15px;font-weight:650}.sub{fill:var(--ink2);font-size:11.5px}.lb{fill:var(--ink2);font-size:11px}.ax{fill:var(--muted);font-size:10.5px}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;fill:var(--ink2)}.g{stroke:var(--grid);stroke-width:1}.note{fill:var(--muted);font-size:10.5px;font-style:italic}@keyframes clkpulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes clkflow{to{stroke-dashoffset:-28}}@keyframes clkpop{0%{opacity:0}3%{opacity:1}92%{opacity:1}100%{opacity:0}}.pulse{animation:clkpulse 2.4s ease-in-out infinite}.flow{animation:clkflow 1.1s linear infinite}.pop{animation:clkpop 6s linear infinite both}@keyframes clkstream{from{transform:translateX(0)}to{transform:translateX(46px)}}@keyframes clklight{0%,12%{opacity:.10}26%,68%{opacity:1}84%,100%{opacity:.10}}.stream{transform-box:fill-box;animation:clkstream 1.15s linear infinite}.light{animation:clklight 3.45s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.pulse,.flow,.pop,.stream,.light{animation:none;opacity:1;transform:none}}
</style>
<rect width="860" height="430" fill="var(--bg)"/>
<text x="28" y="30" class="t">What a stakeholder receives</text>
<rect x="40" y="96" width="780" height="48" rx="7" fill="var(--panel)"/>
<rect x="40" y="96" width="5" height="48" rx="2.5" fill="#e0405f"/>
<text x="62" y="117" class="t" style="font-size:13px">Must stay on gpt-4o</text>
<text x="62" y="134" class="sub">measured, and below the bar — moving these is a known regression</text>
<rect x="40" y="158" width="780" height="48" rx="7" fill="var(--panel)"/>
<rect x="40" y="158" width="5" height="48" rx="2.5" fill="#c2820b"/>
<text x="62" y="179" class="t" style="font-size:13px">Not proven either way</text>
<text x="62" y="196" class="sub">not failures and not passes: unanswered, and shown as unanswered</text>
<rect x="40" y="220" width="780" height="48" rx="7" fill="var(--panel)"/>
<rect x="40" y="220" width="5" height="48" rx="2.5" fill="#0e9bbd"/>
<text x="62" y="241" class="t" style="font-size:13px">Safe to move</text>
<text x="62" y="258" class="sub">cleared the bar across the whole interval, not just on average</text>
<rect x="40" y="282" width="780" height="48" rx="7" fill="var(--panel)"/>
<rect x="40" y="282" width="5" height="48" rx="2.5" fill="#8b5cf6"/>
<text x="62" y="303" class="t" style="font-size:13px">What it saves</text>
<text x="62" y="320" class="sub">a range with the sample it was measured on, or a refusal</text>
<rect x="40" y="344" width="780" height="48" rx="7" fill="var(--panel)"/>
<rect x="40" y="344" width="5" height="48" rx="2.5" fill="#63758f"/>
<text x="62" y="365" class="t" style="font-size:13px">Verify this yourself</text>
<text x="62" y="382" class="sub">the receipt's own JSON, so the page need not be trusted</text>
<text x="40" y="408" class="note">Nothing on this page authorises a cutover. Shadow mode does.</text>
</svg>
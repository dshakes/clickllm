<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Anatomy of a migration receipt. A file, not a dashboard: it leads with what must stay on the incumbent model, then what is not proven either way, then what is proven above the bar, and ends with the movable share, the coverage gaps, and which judge was used. Four properties make it defensible: the bad news is printed first, every number carries a confidence interval, the eval set is identified by digest so the questions can be re-asked, and every field is derived from the counts so a forged copy contradicts itself.">
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f16"/><stop offset=".55" stop-color="#0d1117"/><stop offset="1" stop-color="#12161f"/>
  </linearGradient>
  <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity=".55"/>
  </filter>
  <style>
    .t    { font-family: ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif; }
    .m    { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
    .kick { font-size:11.5px; fill:#6e7681; letter-spacing:.20em; font-weight:700; }
    .h1   { font-size:31px; font-weight:800; fill:#f0f6fc; letter-spacing:-.015em; }
    .lede { font-size:13.5px; fill:#8b949e; }
    .hdr  { font-size:11px; font-weight:800; letter-spacing:.10em; }
    .note { font-size:11.5px; font-weight:700; fill:#e6edf3; }
    .why  { font-size:10.5px; fill:#7d8590; }
    .num  { font-size:13px; font-weight:800; fill:#58a6ff; }
  </style>
</defs>

<rect width="1200" height="660" fill="url(#canvas)"/>

<text class="t kick" x="64" y="52">NOT A DASHBOARD</text>
<text class="t h1"   x="64" y="88">A receipt is a file you can hand to someone who does not trust you</text>
<text class="t lede" x="64" y="114">Self-contained, content-addressed, reproducible, and falsifiable later. Real output, unedited.</text>

<!-- ============ the receipt ============ -->
<g filter="url(#lift)">
  <rect x="64" y="146" width="660" height="452" rx="12" fill="#0d1117" stroke="#30363d"/>
</g>
<rect x="64" y="146" width="660" height="34" rx="12" fill="#161b22"/>
<rect x="64" y="168" width="660" height="12" fill="#161b22"/>
<circle cx="86" cy="163" r="5" fill="#f85149" fill-opacity=".8"/>
<circle cx="104" cy="163" r="5" fill="#d29922" fill-opacity=".8"/>
<circle cx="122" cy="163" r="5" fill="#3fb950" fill-opacity=".8"/>
<text class="m" x="150" y="167" fill="#7d8590">receipt.json</text>

<text class="m" x="88" y="208" fill="#f0f6fc">Migration receipt · gpt-4o-mini → llama-3.1-8b</text>
<text class="m" x="88" y="226" fill="#6e7681">issued 2026-08-10 · digest ee585a091b4d</text>

<text class="t hdr" x="88" y="262" fill="#f85149">MUST STAY ON gpt-4o-mini — PROVEN BELOW THE BAR</text>
<text class="m"     x="88" y="284" fill="#c9d1d9">· Ticket classification    51% [40%–62%] over 80 items</text>

<text class="t hdr" x="88" y="322" fill="#d29922">NOT PROVEN EITHER WAY — NOT ENOUGH EVIDENCE</text>
<text class="m"     x="88" y="344" fill="#c9d1d9">· One-line summary        100% [44%–100%] over 3 items</text>
<text class="m"     x="106" y="362" fill="#7d8590">needs 35 to clear the bar at this rate</text>
<text class="m"     x="88" y="382" fill="#c9d1d9">· Arithmetic                ?</text>

<text class="t hdr" x="88" y="420" fill="#3fb950">PROVEN AT OR ABOVE THE 90% BAR</text>
<text class="m"     x="88" y="442" fill="#c9d1d9">· Structured extraction    98% [94%–100%] over 120 items</text>

<line x1="88" y1="470" x2="700" y2="470" stroke="#21262d"/>
<text class="m" x="88" y="496" fill="#f0f6fc">Movable: 38% of captured traffic</text>
<text class="m" x="88" y="516" fill="#8b949e">Coverage: incomplete — 2 cluster(s) unresolved</text>
<text class="m" x="88" y="536" fill="#8b949e">Judge: none used — every claim from deterministic graders</text>

<text class="m" x="88" y="572" fill="#6e7681">$ onpar receipt ./receipt.json   # anyone can re-verify</text>

<!-- ============ why it is defensible ============ -->
<text class="t kick" x="772" y="170">WHY IT IS DEFENSIBLE</text>

<g>
  <text class="t num"  x="772" y="208">01</text>
  <text class="t note" x="812" y="208">Bad news is printed first</text>
  <text class="t why"  x="812" y="226">A report with no unknowns in it is a report</text>
  <text class="t why"  x="812" y="242">whose unknowns were removed. There is no</text>
  <text class="t why"  x="812" y="258">field in the format that can hold "PASSED".</text>
</g>

<g>
  <text class="t num"  x="772" y="300">02</text>
  <text class="t note" x="812" y="300">Never a number without its interval</text>
  <text class="t why"  x="812" y="318">90% over 20 items and 90% over 400 are the</text>
  <text class="t why"  x="812" y="334">same number and different decisions. A task</text>
  <text class="t why"  x="812" y="350">passes only when its whole interval clears.</text>
</g>

<g>
  <text class="t num"  x="772" y="392">03</text>
  <text class="t note" x="812" y="392">The questions have an exact answer</text>
  <text class="t why"  x="812" y="410">The eval set is identified by digest, so</text>
  <text class="t why"  x="812" y="426">"which questions did you ask" is checkable</text>
  <text class="t why"  x="812" y="442">rather than described. Re-run it yourself.</text>
</g>

<g>
  <text class="t num"  x="772" y="484">04</text>
  <text class="t note" x="812" y="484">A forged copy contradicts itself</text>
  <text class="t why"  x="812" y="502">Every field is derived from the counts — the</text>
  <text class="t why"  x="812" y="518">interval, the band, the evidence still needed.</text>
  <text class="t why"  x="812" y="534">Reseal it and the numbers stop agreeing.</text>
</g>

<line x1="772" y1="558" x2="1136" y2="558" stroke="#21262d"/>
<text class="t why" x="772" y="582" style="fill:#8b949e">A signature says <tspan fill="#c9d1d9">we said this</tspan>. Reproduction says <tspan fill="#c9d1d9">and it is true</tspan>.</text>

<text class="t why" x="64" y="628">Tamper detection answers "was this altered". It cannot answer "was this ever true" — which is why the numbers are derived, not stated.</text>
</svg>

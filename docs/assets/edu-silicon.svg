<rect x="28" y="741" width="9" height="9" rx="2.5" fill="var(--s2)"/><text x="42" y="749" class="lb">compute in use</text><rect x="146" y="741" width="9" height="9" rx="2.5" fill="var(--s1)"/><text x="160" y="749" class="lb">weights</text><rect x="218" y="741" width="9" height="9" rx="2.5" fill="var(--s0)"/><text x="232" y="749" class="lb">KV cache</text><rect x="296" y="741" width="9" height="9" rx="2.5" fill="var(--s3)"/><text x="310" y="749" class="lb">out of reach</text>
<rect x="536" y="741" width="9" height="9" rx="2.5" fill="var(--muted)"/><text x="550" y="749" class="lb">runtime overhead</text>
<text x="28" y="778" class="note">So the 94% is not idle because nobody batched hard enough — it is unreachable until something gives up memory: a</text>
<text x="28" y="794" class="note">smaller quantisation, a shorter context, fp8 KV, or an MLA model whose cache is ~50x smaller. That is the trade</text>
<text x="28" y="810" class="note">clickllm's solver exists to price. The roofline is weights-only and therefore an upper bound; real KV reads push the</text>
<text x="28" y="826" class="note">intensity lower still. Estimates, not measurements.</text>

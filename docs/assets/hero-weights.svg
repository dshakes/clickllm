8.3 L 687.3 141.7" stroke="var(--s1)" stroke-width="1.1" opacity="0.45"/><path d="M 667.0 130.0 L 687.3 141.7" stroke="var(--s1)" stroke-width="1.1" opacity="0.75"/><path d="M 687.3 141.7 L 667.0 153.4" stroke="var(--s1)" stroke-width="1.1" opacity="0.45"/><path d="M 667.0 130.0 L 667.0 153.4" stroke="var(--s1)" stroke-width="1.1" opacity="0.75"/><path d="M 667.0 153.4 L 646.7 141.7" stroke="var(--s1)" stroke-width="1.1" opacity="0.45"/><path d="M 667.0 130.0 L 646.7 141.7" stroke="var(--s1)" stroke-width="1.1" opacity="0.75"/><path d="M 646.7 141.7 L 646.7 118.3" stroke="var(--s1)" stroke-width="1.1" opacity="0.45"/><path d="M 667.0 130.0 L 646.7 118.3" stroke="var(--s1)" stroke-width="1.1" opacity="0.75"/><path d="M 646.7 118.3 L 667.0 106.6" stroke="var(--s1)" stroke-width="1.1" opacity="0.45"/><circle class="light" style="animation-delay:0.90s" cx="667.0" cy="106.6" r="4.3" fill="var(--s2)"/><circle class="light" style="animation-delay:1.02s" cx="687.3" cy="118.3" r="4.3" fill="var(--s2)"/><circle class="light" style="animation-delay:1.14s" cx="687.3" cy="141.7" r="4.3" fill="var(--s2)"/><circle class="light" style="animation-delay:1.26s" cx="667.0" cy="153.4" r="4.3" fill="var(--s0)"/><circle class="light" style="animation-delay:1.38s" cx="646.7" cy="141.7" r="4.3" fill="var(--s0)"/><circle class="light" style="animation-delay:1.50s" cx="646.7" cy="118.3" r="4.3" fill="var(--s0)"/><circle class="light" style="animation-delay:1.6s" cx="667.0" cy="130.0" r="6.4" fill="var(--s0)"/><circle cx="726.0" cy="189.0" r="23.9" fill="var(--bg)"/><circle cx="726.0" cy="189.0" r="21.9" fill="#2ea567"/><path d="M 715.9 189.0 l 6.7 7.2 l 13.9 -14.8" fill="none" stroke="#fff" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="667" y="49.0" class="ax" text-anchor="middle">the model, on the silicon</text>
<path d="M 742 124 l 9 6 l -9 6" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
<rect class="light" style="animation-delay:1.6s" x="756" y="116" width="52" height="26" rx="5" fill="var(--s2)"/>
<text x="782" y="133" class="ax" text-anchor="middle" style="fill:var(--bg)">1 word</text>
<text x="28" y="220" class="note">Then it happens again, from the start, for the next word. That loop is the product: the bus is the ceiling, and</text>
<text x="28" y="236" class="note">everything onpar tunes — batching, quantisation, KV layout — is a way of getting more words out of one trip across</text>
<text x="28" y="252" class="note">it.</text>
</svg>
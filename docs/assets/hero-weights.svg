<rect x="40.0" y="153.0" width="94.0" height="12.0" rx="3" fill="var(--s1)"/>
<text x="87" y="84" class="ax" text-anchor="middle">memory</text>
<text x="87" y="184" class="m" text-anchor="middle">30.5 GB</text>
<rect x="160" y="108" width="424" height="44" rx="8" fill="var(--panel)" stroke="var(--grid)"/>
<clipPath id="lane"><rect x="162" y="110" width="420" height="40" rx="7"/></clipPath>
<g clip-path="url(#lane)">

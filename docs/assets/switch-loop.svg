<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" role="img" aria-label="The Switch Loop: observe, distill, fit, prove, deploy, cut over, guard">
  <defs>
    <style>
      .bg   { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .moat { fill: #1c1610; stroke: #f0883e; stroke-width: 1.5; }
      .t    { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .num  { font-size: 13px; font-weight: 700; fill: #6e7681; }
      .num-m{ font-size: 13px; font-weight: 700; fill: #f0883e; }
      .ttl  { font-size: 15px; font-weight: 650; fill: #e6edf3; }
      .sub  { font-size: 11.5px; fill: #8b949e; }
      .arr  { stroke: #30363d; stroke-width: 1.5; fill: none; }
      .lbl  { font-size: 12px; fill: #8b949e; }
      .hdr  { font-size: 19px; font-weight: 700; fill: #e6edf3; }
      .kick { font-size: 12px; fill: #6e7681; letter-spacing: .09em; }
      .badge{ font-size: 10.5px; font-weight: 700; letter-spacing: .06em; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#30363d"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="400" rx="10"/>
  <text class="t kick" x="38" y="40">CLICKLLM</text>
  <text class="t hdr"  x="38" y="68">The Switch Loop</text>
  <text class="t sub"  x="38" y="90">From a closed-model API bill to a proven open-model deployment — without a risky cutover.</text>

  <!-- stage cards -->
  <g transform="translate(0,124)">
    <!-- 1 OBSERVE -->
    <rect class="card" x="38" y="0" width="132" height="112" rx="8"/>
    <text class="t num" x="54" y="26">①</text>
    <text class="t ttl" x="54" y="48">Observe</text>
    <text class="t sub" x="54" y="70">swap base_url</text>
    <text class="t sub" x="54" y="86">capture traffic</text>
    <text class="t sub" x="54" y="102">redact locally</text>

    <!-- 2 DISTILL (moat) -->
    <rect class="moat" x="190" y="0" width="132" height="112" rx="8"/>
    <text class="t num-m" x="206" y="26">②</text>
    <text class="t ttl" x="206" y="48">Distill</text>
    <text class="t sub" x="206" y="70">cluster by task</text>
    <text class="t sub" x="206" y="86">sample</text>
    <text class="t sub" x="206" y="102">→ private evals</text>

    <!-- 3 FIT -->
    <rect class="card" x="342" y="0" width="132" height="112" rx="8"/>
    <text class="t num" x="358" y="26">③</text>
    <text class="t ttl" x="358" y="48">Fit</text>
    <text class="t sub" x="358" y="70">profile silicon</text>
    <text class="t sub" x="358" y="86">solve memory</text>
    <text class="t sub" x="358" y="102">via llmfit</text>

    <!-- 4 PROVE (moat, hero) -->
    <rect class="moat" x="494" y="0" width="132" height="112" rx="8"/>
    <text class="t num-m" x="510" y="26">④</text>
    <text class="t ttl" x="510" y="48">Prove</text>
    <text class="t sub" x="510" y="70">grade vs.</text>
    <text class="t sub" x="510" y="86">incumbent</text>
    <text class="t sub" x="510" y="102">→ equivalence</text>

    <!-- 5 DEPLOY -->
    <rect class="card" x="646" y="0" width="132" height="112" rx="8"/>
    <text class="t num" x="662" y="26">⑤</text>
    <text class="t ttl" x="662" y="48">Deploy</text>
    <text class="t sub" x="662" y="70">native config</text>
    <text class="t sub" x="662" y="86">mlx · vLLM</text>
    <text class="t sub" x="662" y="102">SGLang · llm-d</text>

    <!-- 6 CUT OVER (moat) -->
    <rect class="moat" x="798" y="0" width="132" height="112" rx="8"/>
    <text class="t num-m" x="814" y="26">⑥</text>
    <text class="t ttl" x="814" y="48">Cut over</text>
    <text class="t sub" x="814" y="70">shadow →</text>
    <text class="t sub" x="814" y="86">canary → cut</text>
    <text class="t sub" x="814" y="102">auto-rollback</text>

    <!-- 7 GUARD (moat) -->
    <rect class="moat" x="950" y="0" width="132" height="112" rx="8"/>
    <text class="t num-m" x="966" y="26">⑦</text>
    <text class="t ttl" x="966" y="48">Guard</text>
    <text class="t sub" x="966" y="70">watch releases</text>
    <text class="t sub" x="966" y="86">re-run evals</text>
    <text class="t sub" x="966" y="102">propose swaps</text>

    <!-- arrows between -->
    <path class="arr" d="M172 56 H188" marker-end="url(#a)"/>
    <path class="arr" d="M324 56 H340" marker-end="url(#a)"/>
    <path class="arr" d="M476 56 H492" marker-end="url(#a)"/>
    <path class="arr" d="M628 56 H644" marker-end="url(#a)"/>
    <path class="arr" d="M780 56 H796" marker-end="url(#a)"/>
    <path class="arr" d="M932 56 H948" marker-end="url(#a)"/>
  </g>

  <!-- feedback loop: guard back to prove -->
  <path d="M1016 250 V282 H560 V250" stroke="#f0883e" stroke-width="1.5" fill="none"
        stroke-dasharray="4 4" marker-end="url(#ao)"/>
  <text class="t lbl" x="700" y="300" fill="#f0883e">new model ships → re-prove on your traffic → propose promotion</text>

  <!-- legend -->
  <g transform="translate(38,336)">
    <rect class="moat" x="0" y="0" width="14" height="14" rx="3"/>
    <text class="t badge" x="22" y="11" fill="#f0883e">MOAT</text>
    <text class="t sub" x="70" y="11">unowned by any existing tool — this is the product</text>
    <rect class="card" x="470" y="0" width="14" height="14" rx="3"/>
    <text class="t badge" x="492" y="11" fill="#8b949e">COMPOSED</text>
    <text class="t sub" x="566" y="11">LiteLLM · llmfit · Inspect AI · vLLM · SGLang · llm-d · GAIE</text>
  </g>
</svg>

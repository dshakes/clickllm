<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 386" width="860" height="386" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,system-ui,sans-serif">
<title id='t'>Prefill and decode are different machines</title><desc id='d'>A timeline of one request: a short, wide, compute-bound prefill reading the whole prompt in parallel, followed by a long sequence of narrow memory-bound decode steps emitting one token each.</desc>
<style>
:root{--s0:#0e9bbd;--s1:#8b5cf6;--s2:#c2820b;--s3:#e0405f;--bg:#0d1320;--panel:#111a2b;--ink:#eef4ff;--ink2:#9fb0cc;--muted:#63758f;--grid:#1c2534;}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}}
:root[data-theme=light]{--s0:#0369a1;--s1:#7e22ce;--s2:#b45309;--s3:#15803d;--bg:#fcfcfb;--panel:#f4f4f2;--ink:#0b0b0b;--ink2:#52514e;--muted:#7a7975;--grid:#e3e3e0;}
.t{fill:var(--ink);font-size:15px;font-weight:650}.sub{fill:var(--ink2);font-size:11.5px}.lb{fill:var(--ink2);font-size:11px}.ax{fill:var(--muted);font-size:10.5px}.m{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;fill:var(--ink2)}.g{stroke:var(--grid);stroke-width:1}.note{fill:var(--muted);font-size:10.5px;font-style:italic}@keyframes clkpulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes clkflow{to{stroke-dashoffset:-28}}@keyframes clkpop{0%{opacity:0}3%{opacity:1}92%{opacity:1}100%{opacity:0}}.pulse{animation:clkpulse 2.4s ease-in-out infinite}.flow{animation:clkflow 1.1s linear infinite}.pop{animation:clkpop 6s linear infinite both}@keyframes clkstream{from{transform:translateX(0)}to{transform:translateX(46px)}}@keyframes clklight{0%,12%{opacity:.10}26%,68%{opacity:1}84%,100%{opacity:.10}}.stream{transform-box:fill-box;animation:clkstream 1.15s linear infinite}.light{animation:clklight 3.45s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.pulse,.flow,.pop,.stream,.light{animation:none;opacity:1;transform:none}}
</style>
<rect width="860" height="386" fill="var(--bg)"/>
<text x="28" y="30" class="t">Prefill and decode are different machines</text>
<text x="28" y="50" class="sub">One request, two phases with opposite bottlenecks — which is why they are tuned, and increasingly served, separately</text>
<text x="88" y="130" class="ax" text-anchor="end">time →</text>
<rect x="100.0" y="108.0" width="128.0" height="44.0" rx="6" fill="var(--s0)"/>
<text x="164" y="136" class="m" text-anchor="middle" fill="var(--bg)">prefill</text>
<rect class="pop" style="animation-delay:0.50s" x="242" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:0.65s" x="268" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:0.80s" x="294" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:0.95s" x="320" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:1.10s" x="346" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:1.25s" x="372" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:1.40s" x="398" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:1.55s" x="424" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:1.70s" x="450" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:1.85s" x="476" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:2.00s" x="502" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:2.15s" x="528" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:2.30s" x="554" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:2.45s" x="580" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:2.60s" x="606" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:2.75s" x="632" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:2.90s" x="658" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:3.05s" x="684" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:3.20s" x="710" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:3.35s" x="736" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:3.50s" x="762" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<rect class="pop" style="animation-delay:3.65s" x="788" y="108" width="22" height="44" rx="5" fill="var(--s1)"/>
<text x="528" y="96" class="lb" text-anchor="middle" fill="var(--s1)">decode — one token per step, 22 steps shown</text>
<rect x="28" y="192" width="392" height="112" rx="10" fill="var(--panel)" stroke="var(--grid)"/>
<rect x="28" y="192" width="4" height="112" rx="2" fill="var(--s0)"/>
<text x="46" y="216" class="lb" fill="var(--s0)">prefill</text>
<text x="46" y="238" class="ax">reads the whole prompt at once</text>
<text x="46" y="255" class="ax">all tokens in parallel → compute-bound</text>
<text x="46" y="272" class="ax">sets time-to-first-token</text>
<text x="46" y="289" class="ax">wants: big chunks, tensor cores busy</text>
<rect x="440" y="192" width="392" height="112" rx="10" fill="var(--panel)" stroke="var(--grid)"/>
<rect x="440" y="192" width="4" height="112" rx="2" fill="var(--s1)"/>
<text x="458" y="216" class="lb" fill="var(--s1)">decode</text>
<text x="458" y="238" class="ax">emits one token, then the next</text>
<text x="458" y="255" class="ax">re-reads all weights per token → bandwidth-bound</text>
<text x="458" y="272" class="ax">sets the gap between tokens</text>
<text x="458" y="289" class="ax">wants: big batches, fast memory</text>
<text x="28" y="346" class="note">A long prompt with a short answer is a prefill problem. A short prompt with a long answer is a decode problem.</text>
<text x="28" y="362" class="note">Tuning for the wrong one is the commonest way to buy hardware that does not help.</text>
</svg>
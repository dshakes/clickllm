<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" role="img" aria-label="Gap map: six steps of switching off closed models, showing which are solved and which are unowned">
  <defs>
    <style>
      .bg   { fill: #0d1117; }
      .col  { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .gap  { fill: #1c1610; stroke: #f0883e; stroke-width: 1.5; }
      .t    { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .hdr  { font-size: 19px; font-weight: 700; fill: #e6edf3; }
      .kick { font-size: 12px; fill: #6e7681; letter-spacing: .09em; }
      .step { font-size: 13.5px; font-weight: 650; fill: #e6edf3; }
      .sub  { font-size: 11.5px; fill: #8b949e; }
      .own  { font-size: 11px; fill: #58a6ff; }
      .none { font-size: 12.5px; font-weight: 700; fill: #f0883e; }
      .ok   { font-size: 12.5px; font-weight: 700; fill: #3fb950; }
      .rule { stroke: #30363d; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="420" rx="10"/>
  <text class="t kick" x="38" y="40">WHY THIS EXISTS</text>
  <text class="t hdr"  x="38" y="68">Six steps to leave a closed model. Five have no owner.</text>
  <text class="t sub"  x="38" y="90">Deployment — the step everyone builds — is the only one already solved. Five times over.</text>

  <g transform="translate(38,118)">
    <!-- column layout: 6 cols, width 158, gap 12 -->
    <!-- 1 -->
    <rect class="gap" x="0" y="0" width="158" height="196" rx="8"/>
    <text class="t step" x="16" y="28">Model choice</text>
    <text class="t sub"  x="16" y="50">Which open model</text>
    <text class="t sub"  x="16" y="66">for my job?</text>
    <line class="rule" x1="16" y1="84" x2="142" y2="84"/>
    <text class="t sub"  x="16" y="106">leaderboards exist</text>
    <text class="t sub"  x="16" y="122">but don't predict</text>
    <text class="t sub"  x="16" y="138">your workload</text>
    <text class="t none" x="16" y="176">UNOWNED</text>

    <!-- 2 -->
    <rect class="gap" x="170" y="0" width="158" height="196" rx="8"/>
    <text class="t step" x="186" y="28">Hardware fit</text>
    <text class="t sub"  x="186" y="50">What runs on the</text>
    <text class="t sub"  x="186" y="66">silicon I own?</text>
    <line class="rule" x1="186" y1="84" x2="312" y2="84"/>
    <text class="t own"  x="186" y="106">llmfit (30.8k★)</text>
    <text class="t sub"  x="186" y="122">local providers</text>
    <text class="t sub"  x="186" y="138">only — no fleets</text>
    <text class="t ok"   x="186" y="176">MOSTLY SOLVED</text>

    <!-- 3 -->
    <rect class="gap" x="340" y="0" width="158" height="196" rx="8"/>
    <text class="t step" x="356" y="28">Proof</text>
    <text class="t sub"  x="356" y="50">Is it good enough</text>
    <text class="t sub"  x="356" y="66">on MY traffic?</text>
    <line class="rule" x1="356" y1="84" x2="482" y2="84"/>
    <text class="t sub"  x="356" y="106">eval tools start</text>
    <text class="t sub"  x="356" y="122">from a hand-written</text>
    <text class="t sub"  x="356" y="138">test set. Yours isn't.</text>
    <text class="t none" x="356" y="176">UNOWNED ★</text>

    <!-- 4 SOLVED -->
    <rect class="col" x="510" y="0" width="158" height="196" rx="8"/>
    <text class="t step" x="526" y="28">Deployment</text>
    <text class="t sub"  x="526" y="50">Get it serving</text>
    <text class="t sub"  x="526" y="66">in production</text>
    <line class="rule" x1="526" y1="84" x2="652" y2="84"/>
    <text class="t own"  x="526" y="106">vLLM · SGLang</text>
    <text class="t own"  x="526" y="122">llm-d · KServe</text>
    <text class="t own"  x="526" y="138">BentoML · Ollama</text>
    <text class="t ok"   x="526" y="176">SOLVED ×6</text>

    <!-- 5 -->
    <rect class="gap" x="680" y="0" width="158" height="196" rx="8"/>
    <text class="t step" x="696" y="28">Cutover</text>
    <text class="t sub"  x="696" y="50">Move traffic</text>
    <text class="t sub"  x="696" y="66">without breaking</text>
    <line class="rule" x1="696" y1="84" x2="822" y2="84"/>
    <text class="t sub"  x="696" y="106">gateways canary on</text>
    <text class="t sub"  x="696" y="122">errors — nobody</text>
    <text class="t sub"  x="696" y="138">gates on quality</text>
    <text class="t none" x="696" y="176">UNOWNED</text>

    <!-- 6 -->
    <rect class="gap" x="850" y="0" width="158" height="196" rx="8"/>
    <text class="t step" x="866" y="28">Staying current</text>
    <text class="t sub"  x="866" y="50">A better model</text>
    <text class="t sub"  x="866" y="66">ships weekly</text>
    <line class="rule" x1="866" y1="84" x2="992" y2="84"/>
    <text class="t sub"  x="866" y="106">you find out from</text>
    <text class="t sub"  x="866" y="122">Twitter, then re-do</text>
    <text class="t sub"  x="866" y="138">the work by hand</text>
    <text class="t none" x="866" y="176">UNOWNED</text>
  </g>

  <g transform="translate(38,348)">
    <rect x="0" y="0" width="1044" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
    <text class="t sub" x="18" y="21" fill="#e6edf3">Everyone builds column 4. It is the only column with incumbents.</text>
    <text class="t sub" x="18" y="38">clickllm builds 1, 3, 5, 6 — and composes 2 and 4 from tools that already won.</text>
  </g>
</svg>

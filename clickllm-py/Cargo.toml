[package]
name = "clickllm-py"
description = "Python bindings for the clickllm datapath — the capture format and the redactor, exposed once."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The import name Python sees. Underscored on purpose: `clickllm.core` is the
# public API. Top-level rather than `clickllm._core` because this ships as its own
# wheel, and two distributions writing into one package directory collide on
# install order. Must also differ from the `clickllm-core` crate, whose lib is
# already `clickllm_core`.
name = "_clickllm_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
clickllm-core = { path = "../clickllm-core", version = "1.2.2" }
clickllm-gateway = { path = "../clickllm-gateway", version = "1.2.2" }
serde_json.workspace = true
# abi3-py311 matches the project's requires-python: one wheel per platform for
# every supported interpreter, rather than one per platform per minor version.
pyo3 = { version = "0.29", features = ["abi3-py311"] }

[lints]
workspace = true

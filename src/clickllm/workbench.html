<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clickllm workbench</title>
<style>
  :root{
    --void:#04060c; --panel:#0b111c; --panel2:#101828; --line:#1a2434; --line2:#243244;
    --ink:#eef4ff; --ink2:#9fb0c8; --ink3:#5d6b80;
    --cyan:#22d3ee; --violet:#a78bfa; --amber:#fbbf24; --emerald:#34d399; --rose:#fb7185;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--void);color:var(--ink);font-family:var(--sans);line-height:1.6;
       height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(60% 50% at 20% -10%,rgba(34,211,238,.10),transparent 70%),
               radial-gradient(50% 40% at 85% 0%,rgba(167,139,250,.08),transparent 70%)}
  code,kbd{font-family:var(--mono)}

  header{position:relative;z-index:2;display:flex;align-items:center;gap:14px;
         padding:0 20px;height:52px;border-bottom:1px solid var(--line);
         background:rgba(4,6,12,.7);backdrop-filter:blur(12px);flex:none}
  .brand{font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;font-size:15px}
  .brand b{color:var(--cyan)}
  .mark{width:8px;height:8px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);
        transform:rotate(45deg);border-radius:1px;margin-right:9px}
  .sp{flex:1}
  .chip{font-size:11px;font-family:var(--mono);color:var(--ink3);border:1px solid var(--line2);
        border-radius:999px;padding:3px 10px}
  .chip b{color:var(--emerald);font-weight:600}

  main{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;
       min-height:0}
  #thread{overflow-y:auto;padding:26px 26px 140px;scroll-behavior:smooth}
  aside{border-left:1px solid var(--line);padding:20px;overflow-y:auto;background:rgba(11,17,28,.5)}

  .turn{max-width:900px;margin:0 auto 22px}
  .you{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px}
  .you .av{width:22px;height:22px;border-radius:6px;background:var(--line2);flex:none;
           display:grid;place-items:center;font-size:10px;color:var(--ink2);font-weight:700}
  .you p{font-size:15px;color:var(--ink);padding-top:1px}
  .bot{display:flex;gap:11px;align-items:flex-start}
  .bot .av{width:22px;height:22px;border-radius:6px;flex:none;background:linear-gradient(135deg,#22d3ee,#0891b2);
           display:grid;place-items:center}
  .bot .av i{width:7px;height:7px;background:#04060c;transform:rotate(45deg);border-radius:1px}
  .bot .body{flex:1;min-width:0}
  .say{font-size:14.5px;color:var(--ink2);margin-bottom:12px}
  .say b{color:var(--ink);font-weight:650}
  .say .hl{color:var(--cyan);font-family:var(--mono);font-size:13.5px}

  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
        border-radius:13px;overflow:hidden;margin-bottom:12px}
  .card > .hd{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);
              font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  .card > .hd .sp{flex:1}
  .card > .bd{padding:14px 16px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
     font-weight:700;padding:7px 10px;border-bottom:1px solid var(--line)}
  td{padding:8px 10px;border-bottom:1px solid rgba(26,36,52,.6);color:var(--ink2)}
  tr:last-child td{border-bottom:0}
  tr.pick td{background:rgba(34,211,238,.07)}
  td.n{text-align:right;font-family:var(--mono)}
  td b{color:var(--ink)}
  .ok{color:var(--emerald)} .warn{color:var(--amber)} .bad{color:var(--rose)} .cy{color:var(--cyan)}
  .tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:1px 7px;
       border-radius:999px;border:1px solid var(--line2);color:var(--ink3)}
  .tag.ok{border-color:rgba(52,211,153,.4);color:var(--emerald)}
  .tag.warn{border-color:rgba(251,191,36,.4);color:var(--amber)}
  pre{font-family:var(--mono);font-size:12.2px;line-height:1.65;color:#bfd0e6;white-space:pre;
      overflow-x:auto}
  .why{font-size:12.5px;color:var(--ink3);margin-top:10px;padding-left:11px;border-left:2px solid var(--line2)}

  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:10px 0 4px}
  .evid{font-size:12.5px;color:var(--ink2);font-family:var(--mono);padding:3px 0}
  .sug{font-size:12.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--line2);
       border-radius:999px;padding:5px 13px;cursor:pointer;font-family:var(--sans);transition:.12s}
  .sug:hover{border-color:var(--cyan);color:var(--ink)}

  .dock{position:absolute;left:0;right:320px;bottom:0;padding:16px 26px 22px;
        background:linear-gradient(to top,var(--void) 62%,transparent);z-index:3}
  .bar{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px;
       background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);
       border-radius:13px;padding:11px 15px;transition:.15s}
  .bar:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.10)}
  .bar i.pr{color:var(--cyan);font-family:var(--mono);font-size:14px;font-style:normal}
  .bar input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-size:14.5px;
             font-family:var(--sans)}
  .bar input::placeholder{color:var(--ink3)}
  .bar kbd{font-size:10px;color:var(--ink3);border:1px solid var(--line2);border-radius:5px;padding:2px 6px}

  aside h4{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan);
           font-weight:700;margin:18px 0 9px}
  aside h4:first-child{margin-top:0}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;gap:10px}
  .kv span:first-child{color:var(--ink3)}
  .kv span:last-child{font-family:var(--mono);color:var(--ink2);text-align:right}
  .bar2{height:5px;border-radius:3px;background:#18202e;overflow:hidden;margin-top:6px}
  .bar2 > i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa)}
  .mini{font-size:11.5px;color:var(--ink3);margin-top:5px}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px}
  .dot.on{background:var(--emerald)} .dot.off{background:#2b3646}

  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line2);
        border-top-color:var(--cyan);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (max-width:980px){ main{grid-template-columns:1fr} aside{display:none} .dock{right:0} }
</style>

<header>
  <span class="brand"><i class="mark"></i>click<b>llm</b></span>
  <span style="color:var(--ink3);font-size:13px">workbench</span>
  <span class="sp"></span>
  <span class="chip">read-only · local · <b>no telemetry</b></span>
</header>

<main>
  <div id="thread"></div>
  <aside>
    <h4>This machine</h4>
    <div id="hw"><span class="spin"></span></div>
    <h4>Catalogue</h4>
    <div id="cat"><span class="spin"></span></div>
    <h4>Try asking</h4>
    <div class="chips" id="side-sug"></div>
  </aside>
  <div class="dock"><div class="bar">
    <i class="pr">&gt;</i>
    <input id="q" autofocus autocomplete="off" spellcheck="false"
           placeholder="what can I run?  ·  where can I run deepseek-v3?  ·  explain qwen3-32b">
    <kbd>↵</kbd>
  </div></div>
</main>

<script>
const $ = s => document.querySelector(s);
const thread = $('#thread');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const api = async (p, q = {}) => {
  const r = await fetch(p + '?' + new URLSearchParams(q), {cache:'no-store'});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
};

// State the user has established through conversation, so follow-ups don't
// repeat themselves: "what about at 128k?" keeps the model you were discussing.
const ctxState = { context: '32k', concurrency: 1, model: null };

/* ── intent routing ───────────────────────────────────────────────────────
   Deterministic, not a language model. Every answer below is a real
   computation this tool can also print from the CLI — the console is a
   conversational surface over the same solver, never a generator of prose
   about numbers it did not compute.                                        */
const INTENTS = [
  { re: /^(?:help|what can (?:you|i) do)\b/i, fn: helpTurn },
  { re: /\bexplain\s+([\w.\-]+)/i,            fn: (m) => explainTurn(m[1]) },
  { re: /\bwhere\b.*?\b([\w.\-]{3,})\s*$/i,   fn: (m) => whereTurn(m[1]) },
  { re: /\b(?:run|deploy|host)\s+([\w.\-]+)\b.*\b(?:on what|where)\b/i, fn: (m) => whereTurn(m[1]) },
  { re: /\b(?:what|which).*\b(?:can i run|fits?|runs?)\b/i, fn: fitTurn },
  { re: /\b(?:fit|models?)\b/i,               fn: fitTurn },
];

function parseParams(text) {
  const ctx = text.match(/(\d+(?:\.\d+)?)\s*([km])\b(?!\s*tok\/s)/i);
  if (ctx) ctxState.context = ctx[1] + ctx[2].toLowerCase();
  const conc = text.match(/(\d+)\s*(?:concurrent|users?|streams?|requests?|at once)/i);
  if (conc) ctxState.concurrency = Math.max(1, parseInt(conc[1], 10));
}

async function ask(text) {
  text = String(text).trim();
  if (!text) return;
  $('#q').value = '';
  addYou(text);
  parseParams(text);
  const turn = addBot();
  try {
    const hit = INTENTS.find(i => i.re.test(text));
    if (!hit) { return await buildTurn(turn, text); }
    await hit.fn(text.match(hit.re), turn);
  } catch (e) {
    turn.innerHTML = `<div class="say"><b class="bad">Couldn't answer that.</b> ${esc(e.message)}</div>`;
  }
  thread.scrollTop = thread.scrollHeight;
}

function addYou(text) {
  const d = document.createElement('div');
  d.className = 'turn';
  d.innerHTML = `<div class="you"><div class="av">You</div><p>${esc(text)}</p></div>`;
  thread.appendChild(d);
}
function addBot() {
  const d = document.createElement('div');
  d.className = 'turn';
  d.innerHTML = `<div class="bot"><div class="av"><i></i></div><div class="body">
    <div class="say"><span class="spin"></span> working…</div></div></div>`;
  thread.appendChild(d);
  thread.scrollTop = thread.scrollHeight;
  return d.querySelector('.body');
}
const chips = (...qs) => `<div class="chips">${qs.map(q =>
  `<button class="sug" onclick="ask('${q.replace(/'/g,"\\'")}')">${esc(q)}</button>`).join('')}</div>`;

/* ── turns ─────────────────────────────────────────────────────────────── */

async function fitTurn(_m, turn) {
  const d = await api('/api/fit', {context: ctxState.context, concurrency: ctxState.concurrency});
  const ok = d.feasible, hw = d.hardware;
  if (!ok.length) {
    turn.innerHTML = `<div class="say">Nothing in the catalogue fits <b>${esc(hw.name)}</b>
      at ${d.context.toLocaleString()} context × ${d.concurrency}.</div>` +
      chips('what can I run at 4k?', 'where can I run phi-4-14b?');
    return;
  }
  const best = ok.find(c => !c.slow) || ok[0];
  ctxState.model = best.model_id;

  turn.innerHTML = `<div class="say">
      <b>${ok.length}</b> of ${ok.length + d.rejected.length} models fit
      <b>${esc(hw.name)}</b> at <span class="hl">${d.context.toLocaleString()}</span> context ×
      <span class="hl">${d.concurrency}</span>. I'd start with <b class="cy">${esc(best.name)}</b>.
    </div>
    <div class="card">
      <div class="hd">what fits<span class="sp"></span>${esc(d.runtime.name)}</div>
      <div class="bd"><table>
        <tr><th>model</th><th>quant</th><th class="n">total</th><th class="n">free</th>
            <th class="n">~tok/s</th><th>licence</th></tr>
        ${ok.map(c => `<tr class="${c.model_id === best.model_id ? 'pick' : ''}">
          <td><b>${esc(c.name)}</b>${c.architecture_verified ? '' : ' <span class="tag warn">est. geometry</span>'}</td>
          <td>${esc(c.quant)}</td>
          <td class="n">${c.total_gb} G</td>
          <td class="n">${c.headroom_gb} G</td>
          <td class="n ${c.slow ? 'warn' : ''}">${c.tokens_per_sec_estimate ?? '—'}</td>
          <td><span class="tag ${c.license_clean_commercial ? 'ok' : 'warn'}">${esc(c.license)}</span></td>
        </tr>`).join('')}
      </table>
      <div class="why">${esc(d.runtime.why)}</div>
      ${d.warnings.map(w => `<div class="why warn">${esc(w)}</div>`).join('')}
      <div class="why">Throughput is a memory-bandwidth estimate, not a measurement.</div>
      </div>
    </div>` +
    chips(`explain ${best.model_id}`, `where can I run ${best.model_id}?`,
          'what fits at 128k?', 'what fits with 16 concurrent users?');
}

async function whereTurn(model, turn) {
  const d = await api('/api/where', {model, context: ctxState.context,
                                     concurrency: ctxState.concurrency});
  ctxState.model = d.model;
  const ok = d.placements.filter(p => p.feasible);
  const no = d.placements.filter(p => !p.feasible);
  const cheapest = ok.filter(p => p.usd_per_mtok).sort((a,b) => a.usd_per_mtok - b.usd_per_mtok)[0];

  turn.innerHTML = `<div class="say">
      <b>${esc(d.name)}</b>${d.active_b ? ` — ${d.params_b}B total, ${d.active_b}B active per token` : ''}
      runs on <b>${ok.length}</b> of ${d.placements.length} hardware classes at
      <span class="hl">${sizeLabel(ctxState.context)}</span> context.
      ${cheapest ? `Cheapest per token: <b class="cy">${esc(cheapest.name)}</b> at $${cheapest.usd_per_mtok}/Mtok.` : ''}
    </div>
    <div class="card">
      <div class="hd">hardware that runs it</div>
      <div class="bd">${ok.length ? `<table>
        <tr><th>hardware</th><th>quant</th><th class="n">total</th><th class="n">~tok/s</th>
            <th class="n">agg tok/s</th><th class="n">$/hr</th><th class="n">$/Mtok</th></tr>
        ${ok.map(p => `<tr class="${cheapest && p.id === cheapest.id ? 'pick' : ''}">
          <td><b>${esc(p.name)}</b></td><td>${esc(p.quant)}</td>
          <td class="n">${p.total_gb} G</td><td class="n">${p.tokens_per_sec ?? '—'}</td>
          <td class="n">${p.aggregate_tokens_per_sec ?? '—'}</td>
          <td class="n">${p.hourly_usd ? '$' + p.hourly_usd.toFixed(2) : '—'}</td>
          <td class="n ${cheapest && p.id === cheapest.id ? 'cy' : ''}">${p.usd_per_mtok ? '$' + p.usd_per_mtok : '—'}</td>
        </tr>`).join('')}</table>
        ${(() => {
          // The API carries `moe_batch_optimism`; rendering the cost column
          // without it puts the optimistic end of a band in front of someone
          // who never asked for the arithmetic. This table also RANKS by it.
          const s = Math.max(...ok.map(p => p.moe_batch_optimism || 1));
          return s > 1 ? `<div class="say">MoE: the weight read is held at the
            active-parameter count, exact only at batch 1. agg tok/s and $/Mtok
            above are the optimistic end of a band up to <b>${s.toFixed(1)}x</b>
            wide at this concurrency.</div>` : '';
        })()}`
        : `<div class="say bad">Nothing in the hardware catalogue can serve this at that shape.</div>`}
        <div class="why">~tok/s is one stream. $/Mtok is $/hr &divide; agg tok/s, the batched total at
          this concurrency &mdash; both roofline estimates, and both assume the machine stays busy.</div>
      </div>
    </div>
    ${no.length ? `<div class="card"><div class="hd bad">will not run</div><div class="bd"><table>
      ${no.slice(0,8).map(p => `<tr><td><b>${esc(p.name)}</b></td>
        <td style="color:var(--ink3)">${esc(p.reason)}</td></tr>`).join('')}
    </table></div></div>` : ''}` +
    chips(`explain ${d.model}`, 'what can I run locally?', `where can I run ${d.model} at 128k?`);
}

async function explainTurn(model, turn) {
  const d = await api('/api/explain', {model, context: ctxState.context,
                                       concurrency: ctxState.concurrency});
  ctxState.model = model;
  turn.innerHTML = `<div class="say">Here is every number and where it came from.
      Nothing below is rounded for presentation.</div>
    <div class="card"><div class="hd">the arithmetic</div>
      <div class="bd"><pre>${esc(d.arithmetic)}</pre></div></div>` +
    chips(`where can I run ${model}?`, 'what else fits?', 'what fits with 8 concurrent users?');
}

function helpTurn(_m, turn) {
  turn.innerHTML = `<div class="say">I answer four things, all computed — never guessed:</div>
    <div class="card"><div class="bd"><table>
      <tr><td><b>what can I run?</b></td><td>models that fit this machine, with licences</td></tr>
      <tr><td><b>where can I run X?</b></td><td>which hardware classes serve it, and what it costs</td></tr>
      <tr><td><b>explain X</b></td><td>the full memory and throughput arithmetic</td></tr>
      <tr><td><b>…at 128k / with 8 users</b></td><td>re-solves at that shape</td></tr>
    </table>
    <div class="why">This console is read-only. It shows and explains; it does not download,
      deploy, or move traffic. Those stay in the CLI, where a human runs them deliberately.</div>
    </div></div>` + chips('what can I run?', 'where can I run deepseek-v3?', 'explain qwen3-30b-a3b');
}

// The build conversation, carried in this tab.
//
// This replaced a canned refusal: anything the six patterns above missed got
// a polite dead end — including the one sentence a real user is most likely to
// type, which is a description of their actual workload. (The refusal's own
// wording is deliberately not quoted here: a test greps this file for it, and
// a comment that repeats it would keep that test green over a live dead end.)
// `session.py` was sitting on the same machine the whole time,
// understanding exactly that and asking the single most useful follow-up, and
// the browser was the only surface that never called it.
//
// The session state lives here, in the page, and is handed back on each turn.
// The server keeps nothing, which is what lets `/api/build` stay a GET and the
// workbench stay read-only.
let buildState = '';

async function buildTurn(turn, text) {
  const r = await api('/api/build', {
    say: text,
    state: buildState,
    // Only on the first turn: the workbench is bound to localhost, so the
    // browser and the hardware are the same machine and asking "what are you
    // deploying on?" of someone sitting at it is a wasted question.
    machine: buildState ? '' : 'detect',
  });
  buildState = r.state;

  const bits = [`<div class="say">${esc(r.said)}</div>`];
  if (r.evidence.length) {
    bits.push('<div class="lbl">understood</div>' +
      r.evidence.map(e => `<div class="evid">${esc(e)}</div>`).join(''));
  }
  if (r.assuming.length) {
    // Assumptions are always visible, never silent — the same rule the CLI
    // follows, for the same reason.
    bits.push('<div class="lbl">assuming</div>' +
      r.assuming.map(a => `<div class="evid">${esc(a)}</div>`).join(''));
  }
  if (r.question) {
    // One question. Never a list: a list is a form.
    bits.push(`<div class="say"><strong>${esc(r.question)}</strong></div>`);
  }
  turn.innerHTML = bits.join('') +
    (r.done ? chips('what can I run?', 'help') : '');
}

const sizeLabel = s => s;

/* ── sidebar ───────────────────────────────────────────────────────────── */
async function sidebar() {
  try {
    const hw = await api('/api/hardware');
    const used = hw.usable_gb / hw.total_gb;
    $('#hw').innerHTML = `
      <div class="kv"><span>device</span><span>${esc(hw.name)}</span></div>
      <div class="kv"><span>memory</span><span>${hw.total_gb} GB</span></div>
      <div class="kv"><span>usable</span><span class="cy">${hw.usable_gb} GB</span></div>
      <div class="bar2"><i style="width:${(used*100).toFixed(0)}%"></i></div>
      <div class="kv" style="margin-top:6px"><span>bandwidth</span>
        <span>${hw.bandwidth_gbps ? hw.bandwidth_gbps + ' GB/s' : 'unknown'}</span></div>
      ${hw.note ? `<div class="mini">${esc(hw.note)}</div>` : ''}`;
  } catch { $('#hw').innerHTML = '<div class="mini bad">hardware unavailable</div>'; }

  try {
    const c = await api('/api/catalog');
    const clean = c.models.filter(m => m.license_ok).length;
    const ver = c.models.filter(m => m.verified).length;
    $('#cat').innerHTML = `
      <div class="kv"><span>models</span><span>${c.models.length}</span></div>
      <div class="kv"><span>clean licence</span><span class="ok">${clean}</span></div>
      <div class="kv"><span>verified arch</span><span>${ver}</span></div>
      <div class="mini"><span class="dot ${ver === c.models.length ? 'on' : 'off'}"></span>
        ${c.models.length - ver} entries have estimated geometry</div>`;
  } catch { $('#cat').innerHTML = '<div class="mini bad">catalogue unavailable</div>'; }

  $('#side-sug').innerHTML = ['what can I run?','where can I run deepseek-v3?','explain qwen3-30b-a3b']
    .map(q => `<button class="sug" onclick="ask('${q.replace(/'/g,"\\'")}')">${esc(q)}</button>`).join('');
}

/* ── boot ──────────────────────────────────────────────────────────────── */
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const v = e.target.value; e.target.value = ''; ask(v); }

[project]
name = "fused-rmsnorm"
version = "0.1.0"
requires-python = ">=3.11"

# vLLM discovers plugins through standard entry points, so this is a
# normal package — not a fork, and not a patched vLLM image.
# Group semantics differ; see clickllm.kernels.ENTRY_POINT_GROUPS.
[project.entry-points."vllm.general_plugins"]
fused-rmsnorm = "fused_rmsnorm:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
